# Staging: production-like, with Swagger available for QA unless disabled.

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  structured:
    format:
      console: ecs
  level:
    com.eduplay: INFO
