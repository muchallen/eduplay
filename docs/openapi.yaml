openapi: 3.1.0
info:
  title: Eduplay API
  description: |-
    REST API for the Eduplay offline-first mathematics game.
    Obtain tokens from /api/v1/auth/login, then send `Authorization: Bearer <accessToken>`.
    Access tokens expire after 15 minutes; a 401 with code TOKEN_EXPIRED means the
    client should call /api/v1/auth/refresh and retry the request.
    Every error response uses the ApiError schema; switch on its `code` field.
  version: 1.0.0
servers:
- url: /
  description: Current host
security:
- bearerAuth: []
paths:
  /api/v1/admin/users/{userId}/subscription:
    put:
      tags:
      - Subscription
      summary: Set a user's subscription (ADMIN only)
      description: "Used by operators or a payment-provider integration to activate,\
        \ extend or cancel."
      operationId: setUserSubscription
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/me/consent:
    post:
      tags:
      - Profile
      summary: Accept the current privacy policy version
      operationId: acceptPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children:
    get:
      tags:
      - Children
      summary: List the signed-in parent's child profiles
      operationId: listChildren
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseChildResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Children
      summary: Create a child profile
      operationId: createChild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/sync:
    post:
      tags:
      - Learning progress
      summary: Upload progress recorded offline
      description: |-
        Idempotent and safe to retry. Up to 500 game results and 500 lesson entries per request; send larger
        queues in several requests. Game results whose id is already stored are ignored. Lesson progress is
        merged: completed beats incomplete, otherwise the higher currentGameIndex wins. The response holds the
        full merged progress, which the client should store locally. Bodies may be sent with
        Content-Encoding: gzip.
      operationId: syncProgress
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/verify-email:
    post:
      tags:
      - Authentication
      summary: Confirm an email address using the emailed verification token
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/verify-email/resend:
    post:
      tags:
      - Authentication
      summary: Re-send the verification email to the current account
      operationId: resendVerification
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a parent account
      description: "Records parental consent, starts a trial subscription, sends a\
        \ verification email and returns tokens for this device."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token
      description: Returns a new access token and a new refresh token; the presented
        refresh token is revoked. Re-using a revoked refresh token signs the account
        out of every device. Persist the new refresh token before using it.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/password-reset/request:
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      description: "Always returns 202 with the same message, whether or not the email\
        \ is registered."
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
      - Authentication
      summary: Set a new password using the emailed reset token
      description: Signs the account out of every device.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Sign out this device (revokes the refresh token)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/logout-all:
    post:
      tags:
      - Authentication
      summary: Sign out every device of the current account
      operationId: logoutAll
      responses:
        "204":
          description: No Content
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Sign in and create a session for this device
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/me:
    get:
      tags:
      - Profile
      summary: Current parent profile
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Profile
      summary: Delete the account
      description: |-
        Requires the current password. Signs out all devices and hides the account and child profiles
        immediately; all data is permanently erased after 30 days.
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - Profile
      summary: Update name and/or phone (partial)
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}:
    get:
      tags:
      - Children
      summary: Get one child profile
      operationId: getChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Children
      summary: Delete a child profile
      description: The profile disappears immediately; its data is permanently erased
        after 30 days.
      operationId: deleteChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - Children
      summary: Update a child profile (partial)
      operationId: updateChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChildRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/subscription:
    get:
      tags:
      - Subscription
      summary: Current subscription status of the signed-in parent
      operationId: getSubscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/me/export:
    get:
      tags:
      - Profile
      summary: Export all personal data held for this account and its children
      operationId: exportData
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/report:
    get:
      tags:
      - Reports
      summary: Parent dashboard report for a child
      description: |-
        Totals, per-topic performance, strong topics, topics needing improvement and recent activity.
        Topic ratings use configurable average-score thresholds and need a minimum number of games.
      operationId: getChildReport
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: days
        in: query
        description: Only include the last N days (omit for all time)
        required: false
        schema:
          type: integer
          format: int32
          maximum: 3650
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildReportResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/progress:
    get:
      tags:
      - Learning progress
      summary: Server-side lesson progress for a child
      operationId: getProgress
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/game-results:
    get:
      tags:
      - Learning progress
      summary: "Game results for a child, newest first"
      operationId: listGameResults
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGameResultResponse"
        default:
          description: "Error. See `code` (for example VALIDATION_FAILED, TOKEN_EXPIRED,\
            \ CHILD_NOT_FOUND, RATE_LIMITED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    UpdateSubscriptionRequest:
      type: object
      properties:
        plan:
          type: string
          maxLength: 32
          minLength: 0
        status:
          type: string
          enum:
          - TRIAL
          - ACTIVE
          - EXPIRED
          - CANCELLED
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        provider:
          type: string
          maxLength: 32
          minLength: 0
        providerReference:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - plan
      - provider
      - startsAt
      - status
    SubscriptionResponse:
      type: object
      properties:
        plan:
          type: string
        status:
          type: string
          enum:
          - TRIAL
          - ACTIVE
          - EXPIRED
          - CANCELLED
        active:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
          format: int64
        provider:
          type: string
    ConsentRequest:
      type: object
      properties:
        policyVersion:
          type: string
          maxLength: 32
          minLength: 0
      required:
      - policyVersion
    ConsentResponse:
      type: object
      properties:
        policyVersion:
          type: string
        acceptedAt:
          type: string
          format: date-time
    CreateChildRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 40
          minLength: 0
        birthYear:
          type: integer
          format: int32
          description: Four-digit birth year; must be within the last 18 years
        avatarId:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[A-Za-z0-9_-]+$"
      required:
      - displayName
    ChildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        birthYear:
          type: integer
          format: int32
        avatarId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameResultItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID generated by the Unity client; re-sending the same id
            is ignored
        sectionId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        topicId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        lessonId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        gameIndex:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        gameType:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        score:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
        attempts:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        mistakes:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        durationSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 0
        completed:
          type: boolean
        playedAt:
          type: string
          format: date-time
      required:
      - attempts
      - completed
      - durationSeconds
      - gameIndex
      - gameType
      - id
      - lessonId
      - mistakes
      - playedAt
      - score
      - sectionId
      - topicId
    LessonProgressItem:
      type: object
      properties:
        sectionId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        topicId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        lessonId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        currentGameIndex:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
      - completed
      - currentGameIndex
      - lessonId
      - sectionId
      - topicId
    SyncRequest:
      type: object
      properties:
        lessonProgress:
          type: array
          items:
            $ref: "#/components/schemas/LessonProgressItem"
          maxItems: 500
          minItems: 0
        gameResults:
          type: array
          items:
            $ref: "#/components/schemas/GameResultItem"
          maxItems: 500
          minItems: 0
    LessonProgressResponse:
      type: object
      properties:
        sectionId:
          type: string
        topicId:
          type: string
        lessonId:
          type: string
        currentGameIndex:
          type: integer
          format: int32
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncResponse:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
          description: Server clock (UTC); use it to correct for device clock drift
        acceptedGameResults:
          type: integer
          format: int32
          description: Game results stored by this request
        duplicateGameResults:
          type: integer
          format: int32
          description: Game results ignored because their id was already stored
        lessonProgress:
          type: array
          description: Complete merged lesson progress for the child; replace the
            local copy with it
          items:
            $ref: "#/components/schemas/LessonProgressResponse"
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
