openapi: 3.1.0
info:
  title: Eduplay API
  description: |-
    REST API for the Eduplay offline-first mathematics game.
    Obtain tokens from /api/v1/auth/login, then send `Authorization: Bearer <accessToken>`.
    Access tokens expire after 15 minutes; a 401 with code TOKEN_EXPIRED means the
    client should call /api/v1/auth/refresh and retry the request.
    Every error response uses the ApiError schema; switch on its `code` field.
    Scores are percent correct (0-100). Children, lesson progress and game results carry
    a gradeId (ecd_a, ecd_b).
  version: 1.1.0
servers:
- url: /
  description: Current host
security:
- bearerAuth: []
paths:
  /api/v1/classes/{classId}/children/{childId}:
    put:
      tags:
      - Classes
      summary: Add a child the teacher created to the class
      description: "Idempotent. Parents' children join with the class join code instead\
        \ (POST /api/v1/children/{childId}/classes)."
      operationId: addClassChild
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Classes
      summary: Remove a child from the class
      description: Idempotent.
      operationId: removeClassChild
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/admin/users/{userId}/subscription:
    put:
      tags:
      - Subscription
      summary: Set a user's subscription (ADMIN only)
      description: "Used by operators or a payment-provider integration to activate,\
        \ extend or cancel."
      operationId: setUserSubscription
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/me/consent:
    post:
      tags:
      - Profile
      summary: Accept the current privacy policy version
      operationId: acceptPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/classes:
    get:
      tags:
      - Classes
      summary: List the signed-in teacher's classes
      operationId: listClasses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassroomResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Classes
      summary: Create a class
      description: The response includes the join code parents use to link their children.
      operationId: createClass
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/classes/{classId}/join-code:
    post:
      tags:
      - Classes
      summary: Replace the class join code
      description: The old code stops working; children already linked stay linked.
      operationId: rotateClassJoinCode
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children:
    get:
      tags:
      - Children
      summary: List child profiles
      description: "Children the caller owns and, for teachers, children linked to\
        \ their classes."
      operationId: listChildren
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseChildResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Children
      summary: Create a child profile
      operationId: createChild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/sync:
    post:
      tags:
      - Learning progress
      summary: Upload progress recorded offline
      description: |-
        Idempotent and safe to retry. Allowed for the child's owner and for teachers of a linked class, and
        never blocked by an ended trial or subscription. Up to 500 game results and 500 lesson entries per request; send larger
        queues in several requests. Game results whose id is already stored are ignored. Lesson progress is
        merged per (gradeId, sectionId, topicId, lessonId): completed beats incomplete, otherwise the higher currentGameIndex wins. The response holds the
        full merged progress, which the client should store locally. Bodies may be sent with
        Content-Encoding: gzip.
      operationId: syncProgress
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/classes:
    get:
      tags:
      - Classes
      summary: Classes a child is linked to (owner only)
      operationId: listChildClasses
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedClassResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Classes
      summary: Link a child to a class with its join code (owner only)
      description: "Gives the class teacher read, report and sync access to the child.\
        \ Idempotent. Limited to 10 attempts per hour per account."
      operationId: joinClass
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClassRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedClassResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/verify-email:
    post:
      tags:
      - Authentication
      summary: Confirm an email address using the emailed verification token
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/verify-email/resend:
    post:
      tags:
      - Authentication
      summary: Re-send the verification email to the current account
      operationId: resendVerification
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a parent or teacher account
      description: "Records consent, starts a trial subscription, sends a verification\
        \ email and returns tokens for this device. Set accountType to TEACHER for\
        \ a teacher account. Email verification is not required to use the API."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token
      description: "Returns a new access token and a new refresh token; the presented\
        \ refresh token is revoked. Retrying with the same refresh token within the\
        \ grace period (60 seconds by default), for example after a lost response,\
        \ returns the same replacement refresh token. Presenting a revoked refresh\
        \ token after that signs the account out of every device (REFRESH_TOKEN_REUSED).\
        \ Persist the new refresh token before using it."
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/password-reset/request:
    post:
      tags:
      - Authentication
      summary: Request a password reset email
      description: "Always returns 202 with the same message, whether or not the email\
        \ is registered."
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
      - Authentication
      summary: Set a new password using the emailed reset token
      description: Signs the account out of every device.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Sign out this device (revokes the refresh token)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/auth/logout-all:
    post:
      tags:
      - Authentication
      summary: Sign out every device of the current account
      operationId: logoutAll
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Sign in and create a session for this device
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/v1/me:
    get:
      tags:
      - Profile
      summary: Current parent profile
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Profile
      summary: Delete the account
      description: |-
        Requires the current password. Signs out all devices and hides the account and child profiles
        immediately; all data is permanently erased after 30 days.
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - Profile
      summary: Update name and/or phone (partial)
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/classes/{classId}:
    get:
      tags:
      - Classes
      summary: Get one class
      operationId: getClass
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Classes
      summary: Delete a class
      description: Removes the class and its links. The children and their data are
        not affected.
      operationId: deleteClass
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - Classes
      summary: Update a class (partial)
      operationId: updateClass
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassroomRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}:
    get:
      tags:
      - Children
      summary: Get one child profile
      operationId: getChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
      - Children
      summary: Delete a child profile
      description: Owner only. The profile disappears immediately; its data is permanently
        erased after 30 days.
      operationId: deleteChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - Children
      summary: Update a child profile (partial)
      description: Owner only; a linked teacher receives 403 CHILD_NOT_OWNED.
      operationId: updateChild
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChildRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/subscription:
    get:
      tags:
      - Subscription
      summary: Current subscription status of the signed-in parent
      operationId: getSubscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/me/export:
    get:
      tags:
      - Profile
      summary: Export all personal data held for this account and its children
      operationId: exportData
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/classes/{classId}/children:
    get:
      tags:
      - Classes
      summary: Children linked to a class
      operationId: listClassChildren
      parameters:
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseChildResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/report:
    get:
      tags:
      - Reports
      summary: Dashboard report for a child
      description: |-
        Totals, per-topic performance, strong topics, topics needing improvement and recent activity, for the
        child's owner or a teacher of a linked class. Topics are reported per grade. Scores are percent correct
        (0-100); a topic is STRONG at an average of 80 or more and NEEDS_IMPROVEMENT below 50 (configurable), and
        needs a minimum number of games to be rated.
      operationId: getChildReport
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: gradeId
        in: query
        description: Only include this grade (omit for all grades)
        required: false
        schema:
          type: string
      - name: days
        in: query
        description: Only include the last N days (omit for all time)
        required: false
        schema:
          type: integer
          format: int32
          maximum: 3650
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildReportResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/progress:
    get:
      tags:
      - Learning progress
      summary: Server-side lesson progress for a child
      operationId: getProgress
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/game-results:
    get:
      tags:
      - Learning progress
      summary: "Game results for a child, newest first"
      operationId: listGameResults
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: gradeId
        in: query
        description: Only results played in this grade
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGameResultResponse"
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/children/{childId}/classes/{classId}:
    delete:
      tags:
      - Classes
      summary: Remove a child from a class (owner only)
      description: Idempotent. The teacher loses access to the child.
      operationId: leaveClass
      parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: classId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error. Switch on `code`; the ApiError schema lists every value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    UpdateSubscriptionRequest:
      type: object
      properties:
        plan:
          type: string
          maxLength: 32
          minLength: 0
        status:
          type: string
          enum:
          - TRIAL
          - ACTIVE
          - EXPIRED
          - CANCELLED
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        provider:
          type: string
          maxLength: 32
          minLength: 0
        providerReference:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - plan
      - provider
      - startsAt
      - status
    SubscriptionResponse:
      type: object
      properties:
        plan:
          type: string
        status:
          type: string
          enum:
          - TRIAL
          - ACTIVE
          - EXPIRED
          - CANCELLED
        active:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
          format: int64
        provider:
          type: string
    ConsentRequest:
      type: object
      properties:
        policyVersion:
          type: string
          maxLength: 32
          minLength: 0
      required:
      - policyVersion
    ConsentResponse:
      type: object
      properties:
        policyVersion:
          type: string
        acceptedAt:
          type: string
          format: date-time
    CreateClassroomRequest:
      type: object
      properties:
        name:
          type: string
          example: ECD A Blue
          maxLength: 80
          minLength: 0
        gradeId:
          type: string
          description: Optional grade the class is for
          example: ecd_a
          pattern: "^[a-z0-9_]{1,32}$"
      required:
      - name
    ClassroomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gradeId:
          type: string
        joinCode:
          type: string
          description: Code parents enter to link their child to this class
          example: K7QM4XPA
        childCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateChildRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 40
          minLength: 0
        birthYear:
          type: integer
          format: int32
          description: Four-digit birth year; must be within the last 18 years
        avatarId:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[A-Za-z0-9_-]+$"
        gradeId:
          type: string
          description: "Grade the child is in: ecd_a or ecd_b"
          example: ecd_a
          pattern: "^[a-z0-9_]{1,32}$"
      required:
      - displayName
      - gradeId
    ChildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        birthYear:
          type: integer
          format: int32
        avatarId:
          type: string
        gradeId:
          type: string
          description: "Current grade, e.g. ecd_a or ecd_b"
        access:
          type: string
          description: "OWNER: the caller created the profile and may edit or delete\
            \ it. TEACHER: the caller teaches a class the child is linked to and may\
            \ read, report on and sync it."
          enum:
          - OWNER
          - TEACHER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameResultItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID generated by the Unity client; re-sending the same id
            is ignored
        gradeId:
          type: string
          description: "Grade the game was played in (ecd_a or ecd_b), not the child's\
            \ current grade"
          example: ecd_a
          pattern: "^[a-z0-9_]{1,32}$"
        sectionId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        topicId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        lessonId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        gameIndex:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        gameType:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        score:
          type: integer
          format: int32
          description: "Percent correct, 0-100, for every game type"
          maximum: 100
          minimum: 0
        attempts:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        mistakes:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        durationSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 0
        completed:
          type: boolean
        playedAt:
          type: string
          format: date-time
      required:
      - attempts
      - completed
      - durationSeconds
      - gameIndex
      - gameType
      - gradeId
      - id
      - lessonId
      - mistakes
      - playedAt
      - score
      - sectionId
      - topicId
    LessonProgressItem:
      type: object
      properties:
        gradeId:
          type: string
          description: Grade the lesson belongs to
          example: ecd_a
          pattern: "^[a-z0-9_]{1,32}$"
        sectionId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        topicId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        lessonId:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        currentGameIndex:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
      - completed
      - currentGameIndex
      - gradeId
      - lessonId
      - sectionId
      - topicId
    SyncRequest:
      type: object
      properties:
        lessonProgress:
          type: array
          items:
            $ref: "#/components/schemas/LessonProgressItem"
          maxItems: 500
          minItems: 0
        gameResults:
          type: array
          items:
            $ref: "#/components/schemas/GameResultItem"
          maxItems: 500
          minItems: 0
    LessonProgressResponse:
      type: object
      properties:
        gradeId:
          type: string
        sectionId:
          type: string
        topicId:
          type: string
        lessonId:
          type: string
        currentGameIndex:
          type: integer
          format: int32
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncResponse:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
          description: Server clock (UTC); use it to correct for device clock drift
        acceptedGameResults:
          type: integer
          format: int32
          description: Game results stored by this request
        duplicateGameResults:
          type: integer
          format: int32
          description: Game results ignored because their id was already stored
        lessonProgress:
          type: array
          description: Complete merged lesson progress for the child; replace the
            local copy with it
          items:
            $ref: "#/components/schemas/LessonProgressResponse"
    JoinClassRequest:
      type: object
      properties:
        joinCode:
          type: string
          description: Join code given by the teacher; case and spaces are ignored
          example: K7QM4XPA
          maxLength: 32
          minLength: 0
      required:
      - joinCode
    LinkedClassResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gradeId:
          type: string
        teacherName:
          type: string
        linkedAt:
          type: string
          format: date-time
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - token
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 8
        fullName:
          type: string
          maxLength: 120
          minLength: 0
        phone:
          type: string
          pattern: "^\\+?[0-9 ()-]{7,20}$"
        policyVersion:
          type: string
          description: "Privacy policy version the parent accepted, e.g. 2026-01"
          maxLength: 32
          minLength: 0
        parentalConsent:
          type: boolean
          description: "The parent (or, for a teacher, the school) confirms consent\
            \ to processing the children's learning data"
        deviceLabel:
          type: string
          maxLength: 100
          minLength: 0
        accountType:
          type: string
          description: PARENT (default) or TEACHER. Teachers can create classes and
            see linked children.
          enum:
          - PARENT
          - TEACHER
      required:
      - email
      - fullName
      - password
      - policyVersion
    AuthResponse:
      type: object
      properties:
        tokenType:
          type: string
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
          - PARENT
          - TEACHER
          - ADMIN
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - refreshToken
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
      required:
      - email
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - newPassword
      - token
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
        deviceLabel:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - email
      - password
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 120
          minLength: 1
          pattern: .*\S.*
        phone:
          type: string
          description: "Phone number, or an empty string to remove it"
          pattern: "^$|^\\+?[0-9 ()-]{7,20}$"
    UpdateClassroomRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          pattern: .*\S.*
        gradeId:
          type: string
          pattern: "^[a-z0-9_]{1,32}$"
    UpdateChildRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 40
          minLength: 1
          pattern: .*\S.*
        birthYear:
          type: integer
          format: int32
        avatarId:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[A-Za-z0-9_-]+$"
        gradeId:
          type: string
          description: Moves the child to another grade. Results already recorded
            keep the grade they were played in.
          example: ecd_b
          pattern: "^[a-z0-9_]{1,32}$"
    ChildExport:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/ChildResponse"
        lessonProgress:
          type: array
          items:
            $ref: "#/components/schemas/LessonProgressResponse"
        gameResults:
          type: array
          items:
            $ref: "#/components/schemas/GameResultResponse"
    DataExportResponse:
      type: object
      properties:
        exportedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/UserResponse"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentResponse"
        subscription:
          $ref: "#/components/schemas/SubscriptionResponse"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildExport"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ClassroomResponse"
    GameResultResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
        sectionId:
          type: string
        topicId:
          type: string
        lessonId:
          type: string
        gameIndex:
          type: integer
          format: int32
        gameType:
          type: string
        score:
          type: integer
          format: int32
        attempts:
          type: integer
          format: int32
        mistakes:
          type: integer
          format: int32
        durationSeconds:
          type: integer
          format: int32
        completed:
          type: boolean
        playedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
    PageResponseChildResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChildResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ChildReportResponse:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        displayName:
          type: string
        generatedAt:
          type: string
          format: date-time
        periodStart:
          type: string
          format: date-time
          description: "Start of the reporting window, or absent for all-time figures"
        gradeId:
          type: string
          description: "Grade the report is limited to, or absent for all grades"
        totals:
          $ref: "#/components/schemas/Totals"
        topics:
          type: array
          description: "One entry per (gradeId, sectionId, topicId); the same topic\
            \ in two grades is reported separately"
          items:
            $ref: "#/components/schemas/TopicPerformance"
        strongTopics:
          type: array
          items:
            $ref: "#/components/schemas/TopicSummary"
        topicsNeedingImprovement:
          type: array
          items:
            $ref: "#/components/schemas/TopicSummary"
        recentActivity:
          $ref: "#/components/schemas/RecentActivity"
    RecentActivity:
      type: object
      properties:
        lastPlayedAt:
          type: string
          format: date-time
        activeDaysLast7:
          type: integer
          format: int32
        activeDaysLast30:
          type: integer
          format: int32
        recentGames:
          type: array
          items:
            $ref: "#/components/schemas/RecentGame"
    RecentGame:
      type: object
      properties:
        gradeId:
          type: string
        sectionId:
          type: string
        topicId:
          type: string
        lessonId:
          type: string
        gameIndex:
          type: integer
          format: int32
        gameType:
          type: string
        score:
          type: integer
          format: int32
        mistakes:
          type: integer
          format: int32
        durationSeconds:
          type: integer
          format: int32
        completed:
          type: boolean
        playedAt:
          type: string
          format: date-time
    TopicPerformance:
      type: object
      properties:
        gradeId:
          type: string
        sectionId:
          type: string
        topicId:
          type: string
        gamesPlayed:
          type: integer
          format: int64
        averageScore:
          type: number
          format: double
        averageMistakes:
          type: number
          format: double
        timeSpentSeconds:
          type: integer
          format: int64
        lessonsCompleted:
          type: integer
          format: int64
        lessonsStarted:
          type: integer
          format: int64
        lastPlayedAt:
          type: string
          format: date-time
        rating:
          type: string
          enum:
          - STRONG
          - DEVELOPING
          - NEEDS_IMPROVEMENT
          - NOT_ENOUGH_DATA
    TopicSummary:
      type: object
      properties:
        gradeId:
          type: string
        sectionId:
          type: string
        topicId:
          type: string
        averageScore:
          type: number
          format: double
        gamesPlayed:
          type: integer
          format: int64
    Totals:
      type: object
      properties:
        lessonsCompleted:
          type: integer
          format: int64
        gamesPlayed:
          type: integer
          format: int64
        gamesCompleted:
          type: integer
          format: int64
        totalTimeSeconds:
          type: integer
          format: int64
        averageScore:
          type: number
          format: double
          description: Average percent correct (0-100)
    ProgressResponse:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
        lessonProgress:
          type: array
          items:
            $ref: "#/components/schemas/LessonProgressResponse"
    PageResponseGameResultResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameResultResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
    AccountDeletionResponse:
      type: object
      properties:
        message:
          type: string
        deletedAt:
          type: string
          format: date-time
        permanentDeletionAfter:
          type: string
          format: date-time
    ApiError:
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        code:
          type: string
          description: |-
            Stable machine-readable error code. Clients should switch on this, not on `message`.
            400: VALIDATION_FAILED (see fieldErrors), MALFORMED_REQUEST, INVALID_PARAMETER, INVALID_GRADE,
            INVALID_BIRTH_YEAR, POLICY_VERSION_MISMATCH, INVALID_OR_EXPIRED_TOKEN (reset or verification link),
            INVALID_PERIOD (admin).
            401: AUTHENTICATION_REQUIRED, TOKEN_EXPIRED (refresh, then retry), INVALID_TOKEN, INVALID_CREDENTIALS,
            INVALID_REFRESH_TOKEN, REFRESH_TOKEN_REUSED (every session revoked; sign in again), ACCOUNT_NOT_FOUND.
            403: FORBIDDEN (wrong role), CHILD_NOT_OWNED (teacher tried to change a parent's child).
            404: CHILD_NOT_FOUND, CLASS_NOT_FOUND, SUBSCRIPTION_NOT_FOUND, USER_NOT_FOUND, NOT_FOUND.
            409: EMAIL_ALREADY_REGISTERED, CHILD_LIMIT_REACHED, DATA_CONFLICT.
            429: RATE_LIMITED (wait for the Retry-After header).
            500: INTERNAL_ERROR.
            Other framework errors use the HTTP status name, e.g. METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE.
          example: VALIDATION_FAILED
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
    FieldViolation:
      properties:
        field:
          type: string
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
